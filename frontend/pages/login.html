
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | POP THE LOOK</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #111;
      background: #faf9f6;
    }

    .top-bar {
      padding: 22px;
      text-align: center;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      color: #111;
      text-decoration: none;
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: 5px;
      font-weight: bold;
    }

    .fashion-photo {
      min-height: 280px;
      background:
        linear-gradient(#0004, #0004),
        url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1600&q=80")
        center 40% / cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 30px;
    }

    .fashion-photo h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      letter-spacing: 4px;
    }

    .signin-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 40px;
      max-width: 900px;
      margin: 45px auto;
      padding: 0 25px;
    }

    .customer-box {
      padding: 30px;
      background: white;
      border: 1px solid #ddd;
    }

    h2 {
      font-family: Georgia, serif;
      font-size: 24px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #111;
      color: white;
      border: 1px solid #111;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .button-light {
      background: white;
      color: #111;
    }

    .forgot {
      display: inline-block;
      margin-top: 15px;
      color: #333;
      font-size: 13px;
    }

    footer {
      padding: 25px;
      text-align: center;
      border-top: 1px solid #ddd;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .signin-container {
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 25px auto;
      }

      .fashion-photo h1 {
        font-size: 30px;
      }

      .customer-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <a class="logo" href="../../index.html">POP THE LOOK</a>
  </header>

  <section class="fashion-photo">
    <div>
      <h1>WELCOME BACK</h1>
      <p style="color:white">Your style. Your statement.</p>
    </div>
  </section>

  <main class="signin-container">
    <section class="customer-box">
      <h2>Existing Customers</h2>
      <p>Sign in to your account.</p>

      <form id="signinForm">
        <label for="email">Email Address</label>
        <input id="email" type="email" required
               autocomplete="email" placeholder="Enter your email">

        <label for="password">Password</label>
        <input id="password" type="password" required
               autocomplete="current-password" placeholder="Enter your password">

        <a class="forgot" href="#" id="forgotLink">Forgotten Password?</a>

        <button class="button" type="submit">SIGN IN</button>
      </form>
    </section>

    <section class="customer-box">
      <h2>New Customers</h2>
      <p>Create an account with POP THE LOOK to get started.</p>

      <a class="button button-light" href="account.html">
        REGISTER NOW
      </a>

      <p>Discover fashion for every occasion.</p>
    </section>
  </main>

  <footer>
    <a href="../../index.html" style="color:#111">Back to Home</a>
    <p>© POP THE LOOK</p>
  </footer>

  <script>
    document.getElementById("signinForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Sign-in is not connected yet. Account authentication will be added later.");
    });

    document.getElementById("forgotLink").addEventListener("click", function(event) {
      event.preventDefault();
      alert("Password recovery will be available when the account system is connected.");
    });
  </script>
</body>
</html>
