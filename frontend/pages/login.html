
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | POP THE LOOK</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Inter:wght@400;700&display=swap');

    body {
      font-family: Inter, sans-serif;
      margin: 0;
    }

    .serif {
      font-family: 'Bodoni Moda', serif;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.8);
    }
  </style><header class="bg-white border-b border-black sticky top-0 z-20">

  <div class="flex items-center justify-between px-8 py-5">

    <!-- Logo -->
    <a href="index.html" class="serif text-2xl tracking-[0.25em] font-bold">
      POP THE LOOK
    </a>


    <!-- Icons -->
    <div class="flex items-center gap-5 text-xl">

      <!-- Wishlist -->
      <button title="Wishlist">
        ♡
      </button>

      <!-- Account -->
      <a href="frontend/pages/login.html" title="Account">
        👤
      </a>

      <!-- Bag -->
      <button class="text-sm font-bold">
        👜 (0)
      </button>

    </div>

  </div>


  <!-- Search -->
  <div class="flex justify-center pb-5 px-5">

    <div class="relative w-full max-w-2xl">

      <span class="absolute left-5 top-1/2 -translate-y-1/2 text-lg">
        🔍
      </span>

      <input
        type="text"
        placeholder="Search outerwear..."
        class="w-full h-12 rounded-full border border-black pl-12 pr-5 outline-none transition-all duration-300 focus:scale-105 focus:shadow-lg"
      >

    </div>

  </div>


</header> </header>

      <main class="flex-1 flex items-center justify-center p-6 overflow-y-auto">

        <div class="w-full max-w-[380px] py-6">

          <h2 class="text-white font-bold text-center mb-3">
            Existing Customers
          </h2>

          <form id="signinForm">

            <label for="email" class="text-white text-[12px] mb-1 block">
              Email Address or Customer Number
            </label>

            <input
              id="email"
              name="email"
              type="text"
              autocomplete="username"
              required
              class="w-full h-11 bg-white/20 backdrop-blur border border-white text-white px-3 rounded mb-3"
            >

            <label for="password" class="text-white text-[12px] mb-1 block">
              Your Password
            </label>

            <div class="flex mb-2">

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="flex-1 min-w-0 h-11 bg-white/20 backdrop-blur border border-white border-r-0 text-white px-3 rounded-l"
              >

              <button
                id="showPassword"
                type="button"
                class="w-16 h-11 bg-white/20 border border-white text-white text-[11px] font-bold rounded-r"
              >SHOW</button>

            </div>

            <a
              href="#"
              id="forgotPassword"
              class="text-white font-bold text-[12px] mb-3 block no-underline"
            >Forgotten Password</a>

            <button
              type="submit"
              class="w-full h-11 bg-black text-white font-bold tracking-widest rounded mb-2"
            >SIGN IN</button>

            <p class="text-white text-[10px] font-bold text-right mb-6">
              BFPO
            </p>

          </form>

          <h2 class="text-white font-bold text-center mb-3">
            New Customers
          </h2>

          <a
            href="account.html"
            class="w-full h-11 bg-black text-white font-bold tracking-widest rounded flex items-center justify-center no-underline"
          >REGISTER NOW</a>

        </div>

      </main>
    </div>
  </div>

  <script>
    const password = document.getElementById('password');
    const showPassword = document.getElementById('showPassword');

    showPassword.addEventListener('click', function () {
      if (password.type === 'password') {
        password.type = 'text';
        showPassword.textContent = 'HIDE';
      } else {
        password.type = 'password';
        showPassword.textContent = 'SHOW';
      }
    });

    document.getElementById('signinForm').addEventListener('submit', function (event) {
      event.preventDefault();
      alert('Sign-in is not connected yet. We will connect your account system later.');
    });

    document.getElementById('forgotPassword').addEventListener('click', function (event) {
      event.preventDefault();
      alert('Password recovery will be added when the account system is connected.');
    });
  </script>

</body>
</html>
