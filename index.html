<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POP THE LOOK</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<div class="app">


<!-- TOP BLACK BAR -->

<div class="shipping-bar">
COMPLIMENTARY SHIPPING ON ORDERS OVER $400 — RETURNS WITHIN 30 DAYS
</div>



<!-- HEADER -->

<header class="main-header">


<div class="logo">
POP THE LOOK
</div>



<div class="header-actions">


<button id="accountBtn" class="icon-button">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.4">
<circle cx="12" cy="8" r="4.2"></circle>
<path d="M4 20c0-4.4 3.6-7.2 8-7.2s8 2.8 8 7.2"></path>
</svg>

</button>




<button id="wishlistBtn" class="icon-button">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.35">
<path d="M12 20s-6.5-4.2-8.7-7.2A4.8 4.8 0 0 1 12 7.5a4.8 4.8 0 0 1 8.7 5.3C18.5 15.8 12 20 12 20z"></path>
</svg>

</button>




<button id="bagBtn" class="bag-button">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.35">

<path d="M6 8h12l-1 12H7L6 8z"></path>

<path d="M9 8V6a3 3 0 0 1 6 0v2"></path>

</svg>

<span>(0)</span>

</button>



</div>





<!-- ACCOUNT DROPDOWN -->

<div id="accountDropdown" class="account-dropdown">


<button id="signinOpen">
SIGN IN / REGISTER
</button>


<button>
MY ACCOUNT
</button>


<button>
MY ORDERS
</button>


<button>
WISHLIST
</button>


<div class="dropdown-line"></div>


<button id="signOut">

<span>→</span> SIGN OUT

</button>


</div>



</header>

    <!-- SEARCH SECTION -->

<section class="search-section">

    <div class="search-container">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="M20 20l-3.5-3.5"></path>
        </svg>


        <input 
            id="searchInput"
            type="text"
            autocomplete="off"
        >


        <span id="searchPlaceholder">
            Search dresses...
        </span>

    </div>

</section>





<!-- HERO SECTION -->

<section class="hero">


<img 
src="assets/hero.jpeg"
alt="Autumn Winter 2026 campaign"
class="hero-image"
>


<div class="hero-overlay"></div>



<div class="hero-content">


<p class="hero-season">
AUTUMN / WINTER 2026
</p>



<h1>

<span>
Quiet luxury.
</span>


<span class="hero-italic">
Loud presence.
</span>


</h1>




<button id="shopButton">

SHOP NOW

</button>



</div>


</section>





<!-- TOAST MESSAGE -->

<div id="toast">

</div>

   <!-- SIGN IN PAGE -->

<div id="signinPage" class="signin-page hidden">


<img 
src="assets/hero.jpeg"
class="signin-background"
alt=""
>


<div class="signin-overlay"></div>



<div class="signin-content">



<!-- TOP BAR -->

<div class="signin-topbar">


<button id="closeSignin" class="back-button">
&lt;
</button>


<h1>
POP THE LOOK
</h1>


</div>





<!-- FORM AREA -->

<div class="signin-form-container">


<div class="signin-form">



<h2>
Existing Customers
</h2>




<label>
Email Address or Customer Number
</label>


<input 
id="emailInput"
type="text"
>




<label>
Your Password
</label>



<div class="password-row">


<input
id="passwordInput"
type="password"
>


<button id="showPassword">
SHOW
</button>


</div>





<p class="forgot-password">
Forgotten Password
</p>




<button class="black-button" id="loginButton">

SIGN IN

</button>




<p class="bfpo">
BFPO
</p>






<div class="register-area">


<h2>
New Customers
</h2>


<button class="black-button" id="registerButton">

REGISTER NOW

</button>


</div>



</div>


</div>


</div>


</div>





</div>


<script src="script.js"></script>

</body>

</html>
