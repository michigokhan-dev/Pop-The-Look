<script>

const placeholders = [
"Search dresses...",
"Search outerwear...",
"Search tops...",
"Search accessories...",
"Search bottoms..."
];


let i = 0;

const search = document.getElementById("search");


setInterval(()=>{

if(search.value === ""){
search.placeholder = placeholders[i];

i++;

if(i >= placeholders.length){
i = 0;
}

}

},2500);


</script>
